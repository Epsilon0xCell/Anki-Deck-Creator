name: Generate Anki Deck and Create Release

on:
  push:
    branches:
      - main  # Change this to your default branch if it's not 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'  # Specify the Python version you need

    - name: Install dependencies
      # Only genanki goes in here, not requirements.txt. This job never
      # runs the AnkiConnect helper scripts, so it does not need
      # requests. The requirements file is for running everything
      # locally, helpers included.
      run: |
        python -m pip install --upgrade pip
        pip install genanki

    - name: Run script to generate Anki deck
      id: generate_deck
      # The deck file name is random, so I find it by glob afterwards.
      # That only works because this runner starts clean. An old .apkg
      # left in the folder would put more than one name into the list
      # file, and the release step below would be handed a value that
      # is not one file name.
      run: |
        python anki-gen.py
        ls *.apkg > apkg_filename.txt

    - name: Read generated file name
      id: read_filename
      run: echo "APKG_FILE=$(cat apkg_filename.txt)" >> $GITHUB_ENV

    - name: Generate random tag name
      # Every push to main cuts a release, so the tag has to be new each
      # time or the release step fails on a tag that already exists.
      # Epoch seconds plus 8 random characters is my way of never
      # reusing one. There is no version meaning in the number.
      id: generate_tag
      run: echo "TAG_NAME=v1.0.0-$(date +%s)-$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 8)" >> $GITHUB_ENV

    - name: Upload Anki deck as artifact
      uses: actions/upload-artifact@v4
      with:
        name: anki-deck
        path: '*.apkg'

    - name: Create GitHub Release and upload the deck
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$TAG_NAME" --title "Anki Deck Release" --notes "" "$APKG_FILE"
